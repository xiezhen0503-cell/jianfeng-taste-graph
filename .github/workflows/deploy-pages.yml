name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "jianfeng-taste-pages-v7-small.part*"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and extract prebuilt Pages package
        run: |
          cat jianfeng-taste-pages-v7-small.part* > jianfeng-taste-pages-v7.zip
          mkdir -p _site
          python3 -m zipfile -e jianfeng-taste-pages-v7.zip _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
